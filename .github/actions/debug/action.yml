name: "Debug GitHub Actions Environment"
description: "Check GitHub Secrets & Environment Variables"

inputs:
  github_token:
    description: "GitHub Token"
    required: true
  npm_token:
    description: "NPM Token"
    required: false

runs:
  using: "composite"
  steps:
    - name: Debug GitHub Secrets & Environment
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        NPM_TOKEN: ${{ inputs.npm_token }}
      run: |
        echo "### 🔍 Checking GitHub Secrets & Environment Variables ###"

        # Check if GITHUB_TOKEN is set
        if [[ -z "$GITHUB_TOKEN" ]]; then
          echo "❌ GITHUB_TOKEN is NOT set. Ensure it is passed correctly.";
        else
          echo "✅ GITHUB_TOKEN is set.";
        fi

        # Check if NPM_TOKEN is set
        if [[ -z "$NPM_TOKEN" ]]; then
          echo "❌ NPM_TOKEN is NOT set.";
        else
          echo "✅ NPM_TOKEN is set.";
        fi
