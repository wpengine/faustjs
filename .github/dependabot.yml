# Dependabot configuration for the faustjs monorepo.
#
# The `increase-if-necessary` strategy keeps Dependabot from narrowing or
# widening a package.json range as long as the new version still satisfies
# the existing range. Dependabot still updates the lockfile, and still
# updates the package.json range when the new version genuinely doesn't
# fit. The intent: peerDependency ranges on shipped packages (e.g. the
# Next.js peer on @faustwp/core) shouldn't be rewritten automatically as
# part of a routine dependency bump; those are deliberate compatibility
# decisions that warrant their own pull request and review.

version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    versioning-strategy: "increase-if-necessary"
    # Release-please only releases for visible changelog types. Production
    # bumps use `deps` so they reach the release PR's Dependencies section;
    # dev bumps stay `chore` because they don't change what users install.
    commit-message:
      prefix: "deps"
      prefix-development: "chore(deps-dev)"
    # Batch routine bumps into one PR per dependency type each week.
    groups:
      dev-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]
      production-dependencies:
        dependency-type: "production"
        update-types: ["minor", "patch"]
    # Majors usually need a migration (Apollo 4, React 19 peers, ESLint flat
    # config, Jest 30) and are taken on deliberately, not as automated bumps.
    # Security updates still open for vulnerable packages.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Dependabot rewrites the `next` peerDependency on @faustwp/core and
      # @faustwp/blocks to the bumped version despite increase-if-necessary,
      # which drops support for older Next.js releases (#2579, #2648). Bump
      # Next.js by hand. Security updates still open because update-types
      # only applies to version updates, so check their peer ranges too.
      - dependency-name: "next"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]

  - package-ecosystem: "composer"
    directory: "/plugins/faustwp"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    versioning-strategy: "increase-if-necessary"
  - package-ecosystem: "github-actions"
    # "/" only covers .github/workflows; the composite actions need listing too.
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
