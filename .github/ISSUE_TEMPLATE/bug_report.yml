name: Bug report
description: Report a bug in Faust.js
labels: ['[Type] Bug', 'Needs Triage']
body:
  - type: markdown
    attributes:
      value: >-
        Thanks for reporting a bug! For questions, use [GitHub
        Discussions](https://github.com/wpengine/faustjs/discussions/categories/q-a)
        or [Discord](https://discord.gg/J2khkF9XYK) instead.
  - type: textarea
    attributes:
      label: Description
      description: What happened, and what did you expect to happen?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
      description: >-
        Steps that reproduce the bug on a clean setup. A link to a repository
        or a minimal code snippet helps most.
      placeholder: |
        1. Clone the `faustwp-getting-started` example
        2. Open `wp-templates/single.js`
        3. See X instead of Y
    validations:
      required: true
  - type: input
    attributes:
      label: '@faustwp/core version'
      placeholder: e.g. 3.4.2
    validations:
      required: true
  - type: input
    attributes:
      label: WordPress version
      placeholder: e.g. 6.9
    validations:
      required: true
  - type: input
    attributes:
      label: '@faustwp/cli version'
      description: Leave blank if not installed.
  - type: input
    attributes:
      label: Faust.js plugin version
      description: Leave blank if not installed.
  - type: textarea
    attributes:
      label: Additional context
      description: >-
        Anything else that helps: error logs, screenshots, other @faustwp
        packages, Next.js, Node.js, or PHP versions, hosting platform.
  - type: checkboxes
    attributes:
      label: Existing issues
      options:
        - label: I searched [existing issues](https://github.com/wpengine/faustjs/issues) and didn't find a match.
          required: true
