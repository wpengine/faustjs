name: Deploy to WordPress.org

on:
  push:
    tags:
      - '@faustwp/wordpress-plugin@*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to operate on (e.g. @faustwp/wordpress-plugin@1.8.8)'
        required: true
        type: string
      dry_run:
        description: 'Build artifacts but skip the wordpress.org deploy job'
        required: false
        default: true
        type: boolean
      redeploy:
        description: 'Delete the existing SVN tag before publishing'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build_artifacts:
    name: Build distribution artifacts
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Compute SVN version from tag
        id: version
        env:
          RAW_REF: ${{ inputs.tag || github.ref_name }}
        run: |
          # Normalize to a tag name (strip refs/tags/), then strip optional leading "v".
          ref="${RAW_REF#refs/tags/}"
          ref="${ref#v}"

          # Strip the Changesets-style "@faustwp/wordpress-plugin@" prefix so VERSION is just "1.8.8".
          version="${ref#@faustwp/wordpress-plugin@}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Resolved SVN version: $version"

      - name: Build distribution artifacts
        # The local composite action is the single source of truth for what the
        # wordpress.org distribution contains: it rsyncs the plugin source into
        # dist/<slug>/ with the .org-specific exclusions applied, and (when
        # upload-artifacts is true) uploads the main zip, the .org zip, and
        # info.json to the matching GitHub Release.
        uses: ./.github/actions/release-plugin
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PLUGIN_DIR: plugins/faustwp
          SLUG: faustwp
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          upload-artifacts: ${{ !inputs.dry_run }}

      - name: Upload .org payload for the deploy job
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: faustwp-org-payload
          path: dist/faustwp
          retention-days: 1
          include-hidden-files: true

  deploy_to_wordpress_org:
    name: Deploy to WordPress.org
    if: ${{ !inputs.dry_run }}
    needs: build_artifacts
    runs-on: ubuntu-22.04
    environment:
      name: wordpress-org
      url: https://wordpress.org/plugins/faustwp/
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Download .org payload
        uses: actions/download-artifact@v4
        with:
          name: faustwp-org-payload
          path: dist/faustwp

      - name: Delete existing SVN tag
        if: ${{ inputs.redeploy }}
        env:
          VERSION: ${{ needs.build_artifacts.outputs.version }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
        run: |
          TAG_URL="https://plugins.svn.wordpress.org/faustwp/tags/${VERSION}"
          if svn info "$TAG_URL" --username "$SVN_USERNAME" --password "$SVN_PASSWORD" --non-interactive >/dev/null 2>&1; then
            svn delete "$TAG_URL" \
              -m "Delete tag ${VERSION} for redeployment" \
              --username "$SVN_USERNAME" --password "$SVN_PASSWORD" \
              --non-interactive
          else
            echo "Tag ${VERSION} did not exist; continuing"
          fi

      - name: WordPress Plugin Deploy
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # v2.3.0
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: faustwp
          # The build_artifacts job produced the .org-stripped payload at dist/faustwp.
          BUILD_DIR: dist/faustwp
          # ASSETS_DIR is resolved against GITHUB_WORKSPACE, not BUILD_DIR.
          ASSETS_DIR: plugins/faustwp/.wordpress-org
          VERSION: ${{ needs.build_artifacts.outputs.version }}
