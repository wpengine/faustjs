name: E2E Test Packages

on:
  pull_request:
    paths:
      - 'examples/next/**'
      - '.github/workflows/e2e-next-faustwp-example.yml'

jobs:
  e2e-test-faustwp-getting-started-example:
    name: (faustwp) Next Getting Started Example on Node ${{ matrix.node }}
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        node: ['20', '22', '24']
    defaults:
      run:
        working-directory: ./
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      # Copy the example from this checkout so the app is built from the
      # PR's own example source.
      - name: copy getting started example
        run: |
          cp -r examples/next/faustwp-getting-started e2e-app
      - name: install and build packages
        working-directory: ./
        run: |
          npm ci
          npm run build
      # Point the app at the local package builds before its first install
      # so npm installs their current dependencies. --install-links copies
      # packages instead of symlinking, avoiding duplicate React instances
      # from split module resolution.
      - name: install e2e-app dependencies
        working-directory: e2e-app
        run: |
          npm pkg set "dependencies.@faustwp/cli=file:../packages/faustwp-cli"
          npm pkg set "dependencies.@faustwp/core=file:../packages/faustwp-core"
          npm install --install-links
      - name: copy env
        working-directory: e2e-app
        run: |
          cp .env.local.sample .env.local
      # Generate the schema to ensure no type collisions
      - name: Generate Schema
        working-directory: e2e-app
        run: |
          npm run generate
      - name: Build
        working-directory: e2e-app
        run: |
          npm run build
