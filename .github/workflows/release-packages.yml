name: Release Packages

on:
  push:
    branches:
      - canary

permissions:
  contents: write      # For creating releases/tags and pushing to the release PR branch
  pull-requests: write # For creating the release PR
  id-token: write      # For npm OIDC authentication

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-22.04
    outputs:
      releases-created: ${{ steps.release.outputs.releases_created }}
      paths-released: ${{ steps.release.outputs.paths_released }}
      plugin-release-created: ${{ steps.release.outputs['plugins/faustwp--release_created'] }}
      plugin-tag: ${{ steps.release.outputs['plugins/faustwp--tag_name'] }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          target-branch: canary

  # release-please bumps plugins/faustwp/package.json but knows nothing about
  # the WordPress plugin header, the readme.txt Stable tag, or the readme.txt
  # changelog. Sync those onto the release PR branch so they ship together.
  sync-plugin-files:
    name: Sync plugin version files
    needs: release-please
    if: needs.release-please.outputs.pr
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout release PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - name: Update plugin header, Stable tag, and readme.txt changelog
        run: node scripts/versionPlugin.js

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "Plugin files already in sync"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: sync plugin version files"
          git push

  publish:
    name: Publish to npm
    needs: release-please
    if: needs.release-please.outputs.releases-created == 'true'
    uses: ./.github/workflows/npm-publish.yml
    with:
      paths: ${{ needs.release-please.outputs.paths-released }}

  # Tags created with GITHUB_TOKEN don't trigger other workflows, so the
  # plugin tag push alone won't start the wordpress.org deploy. Call it here.
  release-plugin:
    name: Deploy plugin
    needs: release-please
    if: needs.release-please.outputs.plugin-release-created == 'true'
    uses: ./.github/workflows/release-plugin.yml
    with:
      tag: ${{ needs.release-please.outputs.plugin-tag }}
      dry_run: false
    secrets: inherit
