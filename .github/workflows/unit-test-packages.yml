name: Test Packages

on:
  pull_request:
    branches-ignore:
      - 'next'
    paths-ignore:
      - '**/*.md'

jobs:
  unit-test_packages:
    name: "Test packages on Node.js ${{ matrix.node }} ${{ matrix.os }}"
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-22.04']
        node: ['22', '24']
    permissions:
      checks: write
      pull-requests: write
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Tests
        run: npm run test

      - name: Code Coverage for FaustWP Core Package
        uses: ./.github/actions/run-coverage
        with:
          working-directory: packages/faustwp-core

      - name: Code Coverage for FaustWP CLI Package
        uses: ./.github/actions/run-coverage
        with:
          working-directory: packages/faustwp-cli
